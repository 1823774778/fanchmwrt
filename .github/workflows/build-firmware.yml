name: Build FanchmWrt firmware (mesh)

on:
  workflow_dispatch:
  push:
    branches:
      - mesh
    paths:
      - "feeds.conf.default"
      - "include/target.mk"
      - "package/fcm/**"
      - "feeds_patches/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_CONFIG: |
    CONFIG_TARGET_x86=y
    CONFIG_TARGET_x86_64=y
    CONFIG_TARGET_x86_64_Generic=y
    CONFIG_TARGET_ROOTFS_PARTSIZE=1024
  SDK_IMAGE: ghcr.io/openwrt/sdk:qualcommax-ipq807x-25.12.6

jobs:
  packages:
    name: Package gate (wifiroam)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Checkout meshzw feed
        uses: actions/checkout@v4
        with:
          repository: 1823774778/meshzw
          ref: 1c19cc9c66865a4136566fcfd7105002bbc32e64
          path: meshzw

      - name: Build mesh packages in OpenWrt SDK
        run: |
          mkdir -p artifacts
          chmod 0777 artifacts
          docker run --rm \
            --volume "$PWD/meshzw:/feed:ro" \
            --volume "$PWD/artifacts:/artifacts" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0='*' \
            "$SDK_IMAGE" \
            bash -lc '
              set -euo pipefail

              if [ ! -d ./scripts ]; then
                bash setup.sh
              fi

              # GitHub mirrors first: git.openwrt.org is slow on runners
              sed -i \
                -e "s#https://git.openwrt.org/feed/#https://github.com/openwrt/#" \
                -e "s#https://git.openwrt.org/openwrt/#https://github.com/openwrt/#" \
                -e "s#https://git.openwrt.org/project/#https://github.com/openwrt/#" \
                feeds.conf.default

              echo "src-link meshzw /feed" >> feeds.conf.default

              ./scripts/feeds update -a
              ./scripts/feeds install -a
              make defconfig

              make package/wifiroam/compile V=s -j"$(nproc)" 2>&1 | tee /artifacts/pkg-gate.log
              make package/luci-app-wifiroam/compile V=s -j"$(nproc)" 2>&1 | tee -a /artifacts/pkg-gate.log

              find bin/packages -type f -name "*.apk" \
                \( -name "wifiroam-*" -o -name "luci-app-wifiroam-*" \) \
                -exec cp -v {} /artifacts/ \;
              ls -lh /artifacts
            '

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-packages
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Publish gate log on failure
        if: failure()
        run: |
          set -e
          mkdir -p ci-log
          if [ -f artifacts/pkg-gate.log ]; then
            (head -n 40 artifacts/pkg-gate.log; echo; echo "=== TAIL ==="; echo; tail -n 400 artifacts/pkg-gate.log) > ci-log/package-gate.log
          else
            echo "package gate produced no log" > ci-log/package-gate.log
          fi
          git config user.name "mesh-ci-bot"
          git config user.email "mesh-ci-bot@users.noreply.github.com"
          git add -f ci-log/package-gate.log
          git commit -m "ci: package gate log (run ${GITHUB_RUN_ID})" || true
          git push --force origin HEAD:ci-logs

  firmware:
    name: Firmware image (x86/64)
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules || true
          sudo apt-get clean
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache

      - name: Feeds update and install
        run: |
          set -o pipefail
          ./scripts/feeds update -a 2>&1 | tee -a build.log
          ./scripts/feeds install -a 2>&1 | tee -a build.log

      - name: Configure target and verify mesh packages
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGET_CONFIG" > .config
          make defconfig
          ./scripts/diffconfig.sh > defconfig.used 2>/dev/null || true
          grep -q '^CONFIG_PACKAGE_wifiroam=y' .config || { echo "::error::wifiroam not selected"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-wifiroam=y' .config || { echo "::error::luci-app-wifiroam not selected"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-fwx-mesh=y' .config || { echo "::error::luci-app-fwx-mesh not selected"; exit 1; }
          echo "mesh packages selected:"
          grep -E '^CONFIG_PACKAGE_(wifiroam|luci-app-wifiroam|luci-i18n-wifiroam|luci-app-fwx-mesh)' .config

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default', 'include/target.mk') }}
          restore-keys: |
            dl-

      - name: Download sources
        run: |
          set -o pipefail
          make -j"$(nproc)" download 2>&1 | tee -a build.log || true

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee -a build.log

      - name: Collect images
        if: success()
        run: |
          mkdir -p out
          find bin/targets -maxdepth 5 -type f \
            \( -name "*.img.gz" -o -name "*.img" -o -name "*.tar.gz" -o -name "*.iso" -o -name "profiles.json" -o -name "*.manifest" \) \
            -exec cp -v {} out/ \;
          ls -lh out

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-x86-64-mesh
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish build log on failure
        if: failure()
        run: |
          set -e
          mkdir -p ci-log
          if [ -f build.log ]; then
            (head -n 60 build.log; echo; echo "=== TAIL ==="; echo; tail -n 500 build.log) > ci-log/build-firmware.log
          else
            echo "no build log was produced" > ci-log/build-firmware.log
          fi
          { echo "### Last 500 log lines"; echo '```'; tail -n 500 build.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "mesh-ci-bot"
          git config user.email "mesh-ci-bot@users.noreply.github.com"
          git add -f ci-log/build-firmware.log
          git commit -m "ci: firmware build log (run ${GITHUB_RUN_ID})" || true
          git push --force origin HEAD:ci-logs
