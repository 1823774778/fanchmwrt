name: Build FanchmWrt firmware (mesh)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - fanchmwrt-25.12.6
  push:
    branches:
      - mesh
    paths:
      - "feeds.conf.default"
      - "include/default-packages.mk"
      - "package/fcm/**"
      - "feeds_patches/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: jdcloud-re-ss-01
            config: |
              CONFIG_TARGET_qualcommax=y
              CONFIG_TARGET_qualcommax_ipq60xx=y
              CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          - id: jdcloud-re-cs-02
            config: |
              CONFIG_TARGET_qualcommax=y
              CONFIG_TARGET_qualcommax_ipq60xx=y
              CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq 2>&1 | tee -a build.log
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache 2>&1 | tee -a build.log

      - name: Feeds update and install
        run: |
          echo "== feeds update ==" | tee -a build.log
          ./scripts/feeds update -a 2>&1 | tee -a build.log
          echo "== feeds install ==" | tee -a build.log
          ./scripts/feeds install -a 2>&1 | tee -a build.log

      - name: Configure target
        env:
          MATRIX_CONFIG: ${{ matrix.config }}
        run: |
          set -o pipefail
          {
            printf '%s\n' "$MATRIX_CONFIG"
            echo "CONFIG_PACKAGE_wifiroam=y"
            echo "CONFIG_PACKAGE_luci-app-wifiroam=y"
            echo "CONFIG_PACKAGE_luci-i18n-wifiroam-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-fwx-mesh=y"
          } > .config
          echo "== .config seed ==" | tee -a build.log
          cat .config | tee -a build.log
          echo "== make defconfig ==" | tee -a build.log
          make defconfig V=s 2>&1 | tee -a build.log
          echo "== selected profile ==" | tee -a build.log
          grep -E '^CONFIG_TARGET_.*DEVICE_' .config | tee -a build.log || true
          echo "== mesh packages ==" | tee -a build.log
          grep -E '^CONFIG_PACKAGE_(wifiroam|luci-app-wifiroam|luci-i18n-wifiroam|luci-app-fwx-mesh)' .config | tee -a build.log || true
          echo "== feed dir ==" | tee -a build.log
          ls -l package/feeds/meshzw/ 2>&1 | tee -a build.log || true
          for c in CONFIG_PACKAGE_wifiroam CONFIG_PACKAGE_luci-app-wifiroam CONFIG_PACKAGE_luci-app-fwx-mesh; do
            if ! grep -q "^$c=y" .config; then
              echo "::error::$c not selected" | tee -a build.log
              exit 1
            fi
          done

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ matrix.id }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            dl-${{ matrix.id }}-

      - name: Download sources
        run: |
          echo "== download ==" | tee -a build.log
          make -j"$(nproc)" download 2>&1 | tee -a build.log || true

      - name: Build firmware
        run: |
          echo "== build ==" | tee -a build.log
          make -j"$(nproc)" V=s 2>&1 | tee -a build.log

      - name: Collect images
        if: success()
        run: |
          mkdir -p out
          find bin/targets -maxdepth 6 -type f \
            \( -name "*.img.gz" -o -name "*.img" -o -name "*.tar.gz" -o -name "*.itb" \
               -o -name "*.bin" -o -name "profiles.json" -o -name "*.manifest" \) \
            -exec cp -v {} out/ \;
          ls -lh out

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-${{ matrix.id }}-mesh
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish build log
        if: always()
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          set +e
          mkdir -p ci-log
          if [ -f build.log ]; then
            cp build.log "ci-log/build-$TARGET_ID.log"
          else
            echo "no build log" > "ci-log/build-$TARGET_ID.log"
          fi
          git config user.name "mesh-ci-bot"
          git config user.email "mesh-ci-bot@users.noreply.github.com"
          git checkout -B "ci-logs-$TARGET_ID"
          git add -f "ci-log/build-$TARGET_ID.log"
          git commit -m "ci: build log $TARGET_ID (run ${GITHUB_RUN_ID})" || true
          git push --force origin "HEAD:ci-logs-$TARGET_ID"
