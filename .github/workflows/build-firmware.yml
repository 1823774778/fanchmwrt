name: Build FanchmWrt firmware (mesh)

on:
  workflow_dispatch:
  push:
    branches:
      - mesh
    paths:
      - "feeds.conf.default"
      - "include/default-packages.mk"
      - "package/fcm/**"
      - "feeds_patches/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: false

env:
  SDK_IMAGE: ghcr.io/openwrt/sdk:qualcommax-ipq807x-25.12.6

jobs:
  packages:
    name: Package gate (wifiroam)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Checkout meshzw feed
        uses: actions/checkout@v4
        with:
          repository: 1823774778/meshzw
          ref: 1c19cc9c66865a4136566fcfd7105002bbc32e64
          path: meshzw

      - name: Build mesh packages in OpenWrt SDK
        run: |
          mkdir -p artifacts
          chmod 0777 artifacts
          docker run --rm \
            --volume "$PWD/meshzw:/feed:ro" \
            --volume "$PWD/artifacts:/artifacts" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0='*' \
            "$SDK_IMAGE" \
            bash -lc '
              set -euo pipefail

              if [ ! -d ./scripts ]; then
                bash setup.sh
              fi

              sed -i \
                -e "s#https://git.openwrt.org/feed/#https://github.com/openwrt/#" \
                -e "s#https://git.openwrt.org/openwrt/#https://github.com/openwrt/#" \
                -e "s#https://git.openwrt.org/project/#https://github.com/openwrt/#" \
                feeds.conf.default

              echo "src-link meshzw /feed" >> feeds.conf.default

              ./scripts/feeds update -a
              ./scripts/feeds install -a
              make defconfig

              make package/wifiroam/compile V=s -j"$(nproc)" 2>&1 | tee /artifacts/pkg-gate.log
              make package/luci-app-wifiroam/compile V=s -j"$(nproc)" 2>&1 | tee -a /artifacts/pkg-gate.log

              find bin/packages -type f -name "*.apk" \
                \( -name "wifiroam-*" -o -name "luci-app-wifiroam-*" \) \
                -exec cp -v {} /artifacts/ \;
              ls -lh /artifacts
            '

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-packages
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Publish gate log
        if: always()
        run: |
          set +e
          mkdir -p ci-log
          if [ -f artifacts/pkg-gate.log ]; then
            cp artifacts/pkg-gate.log ci-log/package-gate.log
          else
            echo "package gate produced no log" > ci-log/package-gate.log
          fi
          git config user.name "mesh-ci-bot"
          git config user.email "mesh-ci-bot@users.noreply.github.com"
          git checkout -B ci-logs-pkg
          git add -f ci-log/package-gate.log
          git commit -m "ci: package gate log (run ${GITHUB_RUN_ID})" || true
          for i in 1 2 3; do
            git fetch origin ci-logs-pkg >/dev/null 2>&1 && git rebase origin/ci-logs-pkg >/dev/null 2>&1
            git push origin HEAD:ci-logs-pkg && break
            sleep 2
          done

  firmware:
    name: Firmware ${{ matrix.id }}
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: x86-64
            desc: x86/64 (Generic)
            config: |
              CONFIG_TARGET_x86=y
              CONFIG_TARGET_x86_64=y
              CONFIG_TARGET_x86_64_Generic=y
              CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          - id: ipq807x
            desc: Qualcomm IPQ807x (Redmi AX6)
            config: |
              CONFIG_TARGET_qualcommax=y
              CONFIG_TARGET_qualcommax_ipq807x=y
              CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6=y
          - id: filogic
            desc: MediaTek Filogic (Xiaomi AX3000T)
            config: |
              CONFIG_TARGET_mediatek=y
              CONFIG_TARGET_mediatek_filogic=y
              CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
          - id: armsr-armv8
            desc: ARM SystemReady (ARMv8 generic)
            config: |
              CONFIG_TARGET_armsr=y
              CONFIG_TARGET_armsr_armv8=y
              CONFIG_TARGET_armsr_armv8_DEVICE_generic=y

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules || true
          sudo apt-get clean
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache

      - name: Feeds update and install
        run: |
          echo "== feeds update ==" | tee -a build.log
          ./scripts/feeds update -a 2>&1 | tee -a build.log
          echo "== feeds install ==" | tee -a build.log
          ./scripts/feeds install -a 2>&1 | tee -a build.log

      - name: Configure target
        run: |
          set -o pipefail
          {
            printf '%s\n' "$MATRIX_CONFIG"
            echo "CONFIG_PACKAGE_wifiroam=y"
            echo "CONFIG_PACKAGE_luci-app-wifiroam=y"
            echo "CONFIG_PACKAGE_luci-i18n-wifiroam-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-fwx-mesh=y"
          } > .config
          cat .config | tee -a build.log
          echo "== make defconfig ==" | tee -a build.log
          make defconfig V=s 2>&1 | tee -a build.log
          echo "== selected device/profile ==" | tee -a build.log
          grep -E '^CONFIG_TARGET_.*(DEVICE_.*|Generic)=y' .config | tee -a build.log || true
          echo "== mesh package selections ==" | tee -a build.log
          grep -E '^CONFIG_PACKAGE_(wifiroam|luci-app-wifiroam|luci-i18n-wifiroam|luci-app-fwx-mesh)' .config | tee -a build.log || true
          echo "== feed check ==" | tee -a build.log
          ls -l package/feeds/meshzw/ | tee -a build.log || true
          for p in wifiroam/Makefile luci-app-wifiroam/Makefile; do
            if [ ! -e "package/feeds/meshzw/$p" ]; then
              echo "::error::meshzw feed package missing: $p" | tee -a build.log
              exit 1
            fi
          done
          for c in CONFIG_PACKAGE_wifiroam CONFIG_PACKAGE_luci-app-wifiroam CONFIG_PACKAGE_luci-app-fwx-mesh; do
            if ! grep -q "^$c=y" .config; then
              echo "::error::$c is not selected - check package availability" | tee -a build.log
              exit 1
            fi
          done
        env:
          MATRIX_CONFIG: ${{ matrix.config }}

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ matrix.id }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            dl-${{ matrix.id }}-
            dl-

      - name: Download sources
        run: |
          echo "== download ==" | tee -a build.log
          make -j"$(nproc)" download 2>&1 | tee -a build.log || true

      - name: Build firmware
        run: |
          set -o pipefail
          echo "== build ==" | tee -a build.log
          make -j"$(nproc)" V=s 2>&1 | tee -a build.log

      - name: Collect images
        if: success()
        run: |
          mkdir -p out
          find bin/targets -maxdepth 6 -type f \
            \( -name "*.img.gz" -o -name "*.img" -o -name "*.tar.gz" -o -name "*.iso" \
               -o -name "*.itb" -o -name "*.bin" -o -name "profiles.json" -o -name "*.manifest" \) \
            -exec cp -v {} out/ \;
          ls -lh out

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-${{ matrix.id }}-mesh
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish build log
        if: always()
        run: |
          set +e
          mkdir -p ci-log
          if [ -f build.log ]; then
            cp build.log "ci-log/build-${{ matrix.id }}.log"
          else
            echo "no build log was produced" > "ci-log/build-${{ matrix.id }}.log"
          fi
          git config user.name "mesh-ci-bot"
          git config user.email "mesh-ci-bot@users.noreply.github.com"
          git checkout -B "ci-logs-${{ matrix.id }}"
          git add -f "ci-log/build-${{ matrix.id }}.log"
          git commit -m "ci: build log ${{ matrix.id }} (run ${GITHUB_RUN_ID})" || true
          for i in 1 2 3; do
            git fetch origin "ci-logs-${{ matrix.id }}" >/dev/null 2>&1 && git rebase "origin/ci-logs-${{ matrix.id }}" >/dev/null 2>&1
            git push origin "HEAD:ci-logs-${{ matrix.id }}" && break
            sleep 2
          done
